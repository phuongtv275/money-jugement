services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: money-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - money-network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: money-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Route server-side Next.js / BFF API requests directly to backend container via Docker DNS
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - money-network

networks:
  money-network:
    name: money-network
    external: true
