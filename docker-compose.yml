services:
  postgres:
    image: postgres:16
    container_name: money-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - money_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - money-network

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: money-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/auth_db
    depends_on:
      - postgres
    networks:
      - money-network

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: money-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Route server-side Next.js / BFF API requests directly to backend container via Docker DNS
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - money-network

volumes:
  money_postgres_data:
    name: money_postgres_data

networks:
  money-network:
    name: money-network
    external: true
