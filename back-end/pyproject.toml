[project]
name = "back-end"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]
